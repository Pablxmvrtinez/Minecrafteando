name: Compilar Tomatazo (Fabric)

on:
  pull_request:
    paths:
      - "mods/fabric/primer-mod/**"
      - ".github/workflows/tomatazo-build.yml"
  push:
    branches: [main]
    paths:
      - "mods/fabric/primer-mod/**"
      - ".github/workflows/tomatazo-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mods/fabric/primer-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Comprobar metadatos de Fabric
        run: python3 scripts/check_metadata.py
      - name: Compilar mod con Gradle Wrapper
        run: bash ./gradlew --no-daemon build
      - name: Inspeccionar JAR generado
        run: python3 scripts/check_jar.py
      - name: Guardar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: tomatazo-fabric-build
          path: mods/fabric/primer-mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
